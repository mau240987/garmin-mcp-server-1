[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "garmin-coach-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Garmin Connect: read activities and health metrics, and build structured training plans."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "garmin-coach-mcp contributors" }]
maintainers = [{ name = "garmin-coach-mcp contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "garmin",
    "garmin-connect",
    "running",
    "training-plan",
    "workouts",
    "fitness",
    "llm",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    "garminconnect>=0.3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/mrosano1987/garmin-mcp-server-1"
Repository = "https://github.com/mrosano1987/garmin-mcp-server-1"
Issues = "https://github.com/mrosano1987/garmin-mcp-server-1/issues"
Changelog = "https://github.com/mrosano1987/garmin-mcp-server-1/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mrosano1987/garmin-mcp-server-1#readme"

[project.scripts]
garmin-coach-mcp = "garmin_coach_mcp.cli:main"

# ---------------------------------------------------------------------------
# Build backend — src layout, version single-sourced from __init__.__version__
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/garmin_coach_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_coach_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["garmin_mcp_server.py"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except  (SPEC: no bare `except Exception`)
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print  (SPEC: stdout is the stdio transport channel)
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    "D203",    # incompatible with D211 (blank line before class docstring)
    "D213",    # incompatible with D212 (multi-line summary position)
    "ISC001",  # conflicts with the formatter
    "PLC0415", # deliberate: heavy imports are deferred so `--help`/`--version` stay instant
    "PLR0913", # MCP tools legitimately take many keyword arguments
    "PLR2004", # HTTP status codes and TCP port bounds read better inline
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place allowed to write to the terminal.
"src/garmin_coach_mcp/cli.py" = ["T201"]
"tests/**" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["garmin_coach_mcp"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = false
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["garminconnect.*", "garth.*", "requests.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals"]
asyncio_mode = "auto"
markers = [
    "integration: talks to the live Garmin Connect API (deselect with '-m \"not integration\"')",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["garmin_coach_mcp"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["src/garmin_coach_mcp", "*/site-packages/garmin_coach_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
