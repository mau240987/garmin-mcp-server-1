name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts garmin_mcp_server.py
          ruff format --check src tests scripts garmin_mcp_server.py
      - name: Type check
        run: mypy
      - name: Client packages in sync with coach/race-coach.md
        run: python scripts/build_coach_packages.py --check
      - name: Tests (no network, no real Garmin calls)
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/garmin-coach-mcp --version
          /tmp/clean/bin/python -c "from garmin_coach_mcp.server import build_server; from garmin_coach_mcp.client import GarminSession; from garmin_coach_mcp.config import Settings; build_server(GarminSession(Settings()))"
